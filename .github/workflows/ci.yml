name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      intentional_failure:
        description: "Run the intentionally failing test (proves CI blocks release)"
        type: boolean
        default: false

# Least privilege: read-only by default, jobs opt in to more.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        env:
          RUN_INTENTIONAL_FAILURE: ${{ inputs.intentional_failure && '1' || '0' }}
        run: pytest --junitxml=test-results.xml
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: test-results.xml

  build-scan-release:
    needs: lint-test   # tests fail -> this job never runs -> nothing is released
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build image
        run: |
          docker build --build-arg APP_VERSION="$VERSION" \
            -t "apex-ops-api:ci" -t "$IMAGE:$VERSION" .

      - name: Scan image (fail on HIGH/CRITICAL fixable vulns)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: apex-ops-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify container runs as non-root
        run: test "$(docker run --rm --entrypoint id apex-ops-api:ci -u)" != "0"

      - name: Smoke test with docker compose
        run: |
          cp .env.example .env
          APP_VERSION=ci docker compose up -d --no-build
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/ready && break
            sleep 2
          done
          curl -fs http://localhost:8000/ready
          curl -fs -X POST http://localhost:8000/items -H 'content-type: application/json' -d '{"name":"smoke"}'
      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Push versioned image to GHCR
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$VERSION"
